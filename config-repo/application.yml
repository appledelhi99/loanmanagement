# Shared defaults served by config-server to every config client
# (api-gateway and the business services, from Phase 3 on).
#
# Rules (ADR-0017):
#   - No secrets here. Secrets come from environment variables, written as ${VARIABLE}.
#   - Each service's own application.yml keeps only its name, its two ports and the config import.

spring:
  threads:
    virtual:
      enabled: true          # blocking code on virtual threads (Java 25)
  mvc:
    problemdetails:
      enabled: true          # RFC 9457 error bodies (ADR-0021)
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus   # served only on the management port (ADR-0023)
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    sampling:
      probability: 1.0                    # 100% locally; lowered in the aws profile (ADR-0016)

# Eureka is used only in Docker Compose (application-docker.yml turns it on).
eureka:
  client:
    enabled: false
